<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive navigation regression fixture</title>
  <script>
    var fixtureThemes = ['blue', 'dark', 'green', 'light', 'pink'];
    var requestedTheme = new URLSearchParams(window.location.search).get('theme');
    window.fixtureTheme = fixtureThemes.indexOf(requestedTheme) === -1 ? 'dark' : requestedTheme;
    document.write('<link rel="stylesheet" href="../../css/mikhmon-ui.' + window.fixtureTheme + '.min.css">');
  </script>
  <link rel="stylesheet" href="../../css/mikhmon-responsive.css">
  <script defer src="../../js/mikhmon-responsive.js"></script>
</head>
<body>
  <script>document.body.className = 'theme-' + window.fixtureTheme;</script>
  <div id="navbar" class="navbar">
    <div class="navbar-left">
      <button id="openNav" type="button">Menu</button>
      <button id="closeNav" type="button">Tutup</button>
    </div>
    <div class="navbar-right">
      <a id="logout" href="#logout">Keluar</a>
      <button class="mobile-tools-toggle" type="button" aria-controls="mobileToolsPanel" aria-expanded="false">Pengaturan Cepat</button>
      <div id="mobileToolsPanel" class="mobile-tools-panel">
        <select aria-label="Pilih tema"><option>Dark</option></select>
        <select aria-label="Pilih bahasa"><option>Indonesia</option></select>
        <select aria-label="Pilih session"><option>Router A</option></select>
        <span class="idle-time-status">
          <i class="fa fa-clock-o" aria-hidden="true"></i>
          <span class="idle-time-label">Idle Time</span>
          <span id="timer">10:00</span>
        </span>
      </div>
    </div>
  </div>
  <div id="sidenav" class="sidenav">
    <a class="menu" href="#dashboard">Dashboard</a>
    <div class="dropdown-btn">Pelanggan</div>
    <div class="dropdown-container menu-open">
      <a href="#vouchers"><i class="fa fa-ticket"></i> Voucher List</a>
      <a href="#customers"><i class="fa fa-id-card"></i> Daftar Pelanggan</a>
      <a class="billing-submenu" href="#billing"><i class="fa fa-file-text-o"></i><span>Tagihan Berjalan</span></a>
      <a href="#logs"><i class="fa fa-history"></i> System Logs</a>
      <div class="dropdown-btn nested-dropdown-btn" role="button" tabindex="0" aria-expanded="false">
        <i class="fa fa-pie-chart"></i><span class="nested-dropdown-label">Profil Pengguna</span><i class="fa fa-caret-down"></i>
      </div>
      <div class="dropdown-container nested-dropdown-container"><a href="#profiles"><i class="fa fa-list"></i> Daftar Profil</a></div>
    </div>
    <div class="dropdown-btn">Billing</div>
    <div class="dropdown-container"><a href="#paid"><i class="fa fa-check-square-o"></i> Invoice Lunas</a></div>
    <a class="menu" href="#settings">Pengaturan</a>
  </div>
  <div id="main"><output id="result">PENDING</output></div>

  <script src="../../js/mikhmon-ui.dark.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function luminance(color) {
        var channels = color.match(/[\d.]+/g).slice(0, 3).map(function (channel) {
          var value = Number(channel) / 255;
          return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
      }

      function contrastRatio(foreground, background) {
        var foregroundLuminance = luminance(foreground);
        var backgroundLuminance = luminance(background);
        var lighter = Math.max(foregroundLuminance, backgroundLuminance);
        var darker = Math.min(foregroundLuminance, backgroundLuminance);
        return (lighter + 0.05) / (darker + 0.05);
      }

      function finish(passed) {
        document.documentElement.setAttribute('data-test-result', passed ? 'PASS' : 'FAIL');
        document.documentElement.setAttribute('data-test-theme', window.fixtureTheme);
        document.getElementById('result').textContent = passed ? 'PASS' : 'FAIL';
      }

      var items = document.querySelectorAll('#sidenav .menu, #sidenav .dropdown-btn');
      var containers = document.querySelectorAll('#sidenav .dropdown-container');

      items.forEach(function (item) { item.style.display = 'none'; });
      containers.forEach(function (container) { container.style.display = 'none'; });
      document.getElementById('openNav').click();

      var visibleItems = Array.prototype.filter.call(items, function (item) {
        return window.getComputedStyle(item).display !== 'none';
      });
      var logout = document.getElementById('logout');
      var logoutStyle = window.getComputedStyle(logout);
      var logoutSurface = window.innerWidth <= 1024 ? document.getElementById('sidenav') : document.getElementById('navbar');
      var logoutVisible = logoutStyle.display !== 'none' && logoutStyle.visibility !== 'hidden' && Number(logoutStyle.opacity) > 0;
      var logoutSurfaceColor = window.getComputedStyle(logoutSurface).backgroundColor;
      var logoutContrast = contrastRatio(logoutStyle.color, logoutSurfaceColor);
      var logoutContrastPasses = logoutContrast >= 4.5;
      document.documentElement.setAttribute('data-logout-color', logoutStyle.color);
      document.documentElement.setAttribute('data-logout-surface', logoutSurfaceColor);
      document.documentElement.setAttribute('data-logout-contrast', logoutContrast.toFixed(2));
      document.documentElement.setAttribute('data-logout-visible', logoutVisible ? 'true' : 'false');
      var activeSubmenu = document.querySelector('.dropdown-container.menu-open');
      var submenuLinks = activeSubmenu.querySelectorAll(':scope > a');
      var submenuIconLefts = [];
      var submenuLabelLefts = [];
      var submenuTargetsLargeEnough = true;
      submenuLinks.forEach(function (link) {
        var icon = link.querySelector('i');
        var walker = document.createTreeWalker(link, NodeFilter.SHOW_TEXT);
        var textNode = walker.nextNode();
        while (textNode && !textNode.nodeValue.trim()) textNode = walker.nextNode();
        var range = document.createRange();
        range.selectNodeContents(textNode);
        submenuIconLefts.push(icon.getBoundingClientRect().left);
        submenuLabelLefts.push(range.getBoundingClientRect().left);
        if (link.getBoundingClientRect().height < 44) submenuTargetsLargeEnough = false;
      });
      var submenuAlignmentMatches = Math.max.apply(Math, submenuIconLefts) - Math.min.apply(Math, submenuIconLefts) < 0.5 &&
        Math.max.apply(Math, submenuLabelLefts) - Math.min.apply(Math, submenuLabelLefts) < 0.5;
      var topLevelButton = document.querySelector('#sidenav > .dropdown-btn');
      var nestedButton = activeSubmenu.querySelector(':scope > .nested-dropdown-btn');
      var nestedCaret = nestedButton.querySelector('.fa-caret-down');
      var nestedLabel = nestedButton.querySelector('.nested-dropdown-label');
      var nestedContainer = activeSubmenu.querySelector(':scope > .nested-dropdown-container');
      nestedButton.click();
      var nestedOpenedByClick = window.getComputedStyle(nestedContainer).display !== 'none';
      var nestedLink = nestedContainer.querySelector(':scope > a');
      var nestedLinkText = nestedLink.lastChild;
      var nestedLinkTextRange = document.createRange();
      nestedLinkTextRange.selectNodeContents(nestedLinkText);
      var nestedButtonRect = nestedButton.getBoundingClientRect();
      var nestedCaretRect = nestedCaret.getBoundingClientRect();
      var nestedButtonAligned = window.getComputedStyle(nestedButton).display === 'grid' &&
        Math.abs(nestedButtonRect.left - topLevelButton.getBoundingClientRect().left) < 0.5 &&
        Math.abs(nestedLabel.getBoundingClientRect().left - Math.min.apply(Math, submenuLabelLefts)) < 0.5 &&
        nestedButtonRect.height >= 44 &&
        Math.abs((nestedCaretRect.top + nestedCaretRect.height / 2) - (nestedButtonRect.top + nestedButtonRect.height / 2)) < 0.5;
      var nestedLinkIndented = window.getComputedStyle(nestedContainer).display !== 'none' &&
        nestedLinkTextRange.getBoundingClientRect().left - Math.min.apply(Math, submenuLabelLefts) >= 10 &&
        nestedLink.getBoundingClientRect().height >= 44;
      var toolsToggle = document.querySelector('.mobile-tools-toggle');
      var toolsPanel = document.querySelector('.mobile-tools-panel');
      var navbarTools = document.querySelector('.navbar-right');
      var toolbarSelects = toolsPanel.querySelectorAll('select');
      var timer = document.getElementById('timer');
      var toolbarLeftsBeforeCountdown = Array.prototype.map.call(toolbarSelects, function (select) {
        return select.getBoundingClientRect().left;
      });
      var navbarToolsRectBeforeCountdown = navbarTools.getBoundingClientRect();
      timer.textContent = '9:59';
      var toolbarLeftsAfterCountdown = Array.prototype.map.call(toolbarSelects, function (select) {
        return select.getBoundingClientRect().left;
      });
      var navbarToolsRectAfterCountdown = navbarTools.getBoundingClientRect();
      var toolbarStableDuringCountdown = toolbarLeftsBeforeCountdown.every(function (left, index) {
        return Math.abs(left - toolbarLeftsAfterCountdown[index]) < 0.5;
      }) && Math.abs(navbarToolsRectBeforeCountdown.left - navbarToolsRectAfterCountdown.left) < 0.5 &&
        Math.abs(navbarToolsRectBeforeCountdown.width - navbarToolsRectAfterCountdown.width) < 0.5 &&
        window.getComputedStyle(timer).fontVariantNumeric.indexOf('tabular-nums') !== -1;
      if (window.innerWidth > 1024) {
        finish(document.body.classList.contains('nav-open') &&
          visibleItems.length === items.length &&
          window.getComputedStyle(toolsToggle).display === 'none' &&
          window.getComputedStyle(toolsPanel).display === 'contents' &&
          window.getComputedStyle(toolsPanel.querySelector('select')).display !== 'none' &&
          toolbarStableDuringCountdown &&
          logoutVisible && logoutContrastPasses &&
          submenuAlignmentMatches && submenuTargetsLargeEnough && nestedButtonAligned && nestedLinkIndented && nestedOpenedByClick &&
          document.documentElement.scrollWidth <= window.innerWidth);
        return;
      }

      var toolsInitiallyHidden = window.getComputedStyle(toolsPanel).display === 'none';
      toolsToggle.click();
      var toolsOpened = window.getComputedStyle(toolsPanel).display !== 'none' &&
        toolsToggle.getAttribute('aria-expanded') === 'true';
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      var toolsClosedWithEscape = window.getComputedStyle(toolsPanel).display === 'none' &&
        toolsToggle.getAttribute('aria-expanded') === 'false' &&
        document.body.classList.contains('nav-open');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      var drawerClosedWithEscape = !document.body.classList.contains('nav-open');
      document.getElementById('openNav').click();
      toolsToggle.click();
      var passed = document.body.classList.contains('nav-open') &&
        visibleItems.length === items.length &&
        window.getComputedStyle(activeSubmenu).display !== 'none' &&
        logoutVisible && logoutContrastPasses &&
        submenuAlignmentMatches && submenuTargetsLargeEnough && nestedButtonAligned && nestedLinkIndented && nestedOpenedByClick &&
        parseFloat(window.getComputedStyle(toolsToggle).height) >= 44 &&
        toolbarStableDuringCountdown &&
        document.documentElement.scrollWidth <= window.innerWidth &&
        toolsInitiallyHidden && toolsOpened && toolsClosedWithEscape && drawerClosedWithEscape;

      finish(passed);
    });
  </script>
</body>
</html>
